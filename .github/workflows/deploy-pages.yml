name: Deploy Fable Surfer to GitHub Pages

# Roll out to Pages automatically on every push to the working branch,
# plus a manual trigger from the Actions tab.
#
# Pages on this repo is configured with a *branch* source (gh-pages), so
# we publish the static site there with the default GITHUB_TOKEN. That
# push triggers GitHub's managed "pages build and deployment" pipeline,
# which serves the site. (The Pages *API* enablement path needs admin
# rights the Actions token doesn't have, so we deliberately avoid it.)
on:
  push:
    branches: [claude/subway-surfers-overview-po5y8y]
  workflow_dispatch:

permissions:
  contents: write

# One rollout at a time; a newer push supersedes an in-flight one.
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Gather just the files the game needs into a clean publish root.
      - name: Assemble static site
        run: |
          mkdir -p _site
          cp index.html style.css README.md _site/
          cp -r js vendor _site/
          touch _site/.nojekyll   # serve files as-is, skip Jekyll

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: "Deploy ${{ github.sha }}"
